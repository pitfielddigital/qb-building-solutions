name: Deploy to GitHub Pages


on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target (production requires approved privacy policy)'
        type: choice
        default: preview
        options:
          - preview
          - production

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && '/' || '/qb-building-solutions/' }}
      PUBLIC_SITE_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'false' || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production release dependencies
        run: npm audit --audit-level=high

      - name: Check production publication approval
        if: env.PUBLIC_SITE_PREVIEW == 'false'
        run: npm run check:publication

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build with Astro
        run: npm run build

      - name: Check generated site
        run: npm run check:site

      - name: Remove custom domain file from subpath preview
        if: env.PUBLIC_SITE_PREVIEW == 'true'
        run: rm -f dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
