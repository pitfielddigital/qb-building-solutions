name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: npm run check:site
      - name: Validate subpath preview
        env:
          SITE_BASE: /qb-building-solutions/
          PUBLIC_SITE_PREVIEW: 'true'
        run: |
          npm run build
          npm run check:site
